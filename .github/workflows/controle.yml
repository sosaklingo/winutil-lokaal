name: Pakket controleren

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Controleer SHA-256 en PowerShell-syntaxis
        shell: powershell
        run: .\WinUtil-Lokaal.ps1 -Mode Verify
