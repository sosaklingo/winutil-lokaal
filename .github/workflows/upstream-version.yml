name: WinUtil-versie controleren / Check upstream version

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare pinned package with latest official release
        shell: powershell
        run: |
          $files = @(Get-ChildItem -File -Filter 'winutil-*.ps1')
          if ($files.Count -ne 1 -or $files[0].BaseName -notmatch '^winutil-(\d+\.\d+\.\d+)$') { throw 'Unexpected package version.' }
          $current = $Matches[1]
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/ChrisTitusTech/winutil/releases/latest' -Headers @{ 'User-Agent' = 'WinUtil-Lokaal-Version-Check' }
          $latest = [string]$release.tag_name
          if ($latest -notmatch '^\d+\.\d+\.\d+$') { throw 'Unexpected upstream tag.' }
          $summary = "Pinned: $current / Latest: $latest"
          if ([version]$latest -gt [version]$current) {
            Write-Output "::warning::New upstream WinUtil release $latest is available. Manual review required."
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host $summary
